name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -q SHREE_RADHE_Android_Project_v5.zip -d android-project

      - name: Show extracted files
        run: |
          echo "=== Extracted project ==="
          find android-project -maxdepth 6 -type f | head -300

      - name: Find Android project
        run: |
          GRADLEW=$(find android-project -type f -iname "gradlew" | head -n 1)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
            echo "Gradle wrapper found: $GRADLEW"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            echo "USE_WRAPPER=true" >> "$GITHUB_ENV"
          else
            BUILD_FILE=$(find android-project -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)

            if [ -z "$BUILD_FILE" ]; then
              echo "ERROR: No Gradle project found."
              echo "The ZIP does not contain gradlew, build.gradle, or build.gradle.kts."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$BUILD_FILE")
            echo "Gradle build file found: $BUILD_FILE"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            echo "USE_WRAPPER=false" >> "$GITHUB_ENV"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ "$USE_WRAPPER" = "true" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHREE-RADHE-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/*.apk
          if-no-files-found: error
