name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: zip
        shell: bash
        run: |
          ZIP_FILE="SHREE_RADHE_Android_Project_v5.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Expected ZIP not found. Available ZIP files:"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found: $ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "===== Extracted files ====="
          find android-project -maxdepth 5 -type f | head -300

      - name: Find Android Gradle project
        shell: bash
        run: |
          echo "===== Searching for Gradle project ====="

          SETTINGS_FILE=$(find android-project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "Found settings file:"
            echo "$SETTINGS_FILE"
          else
            BUILD_FILE=$(find android-project -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              | head -n 1)

            if [ -z "$BUILD_FILE" ]; then
              echo "ERROR: No Gradle project found."
              echo "===== All extracted files ====="
              find android-project -type f -print
              exit 1
            fi

            PROJECT_DIR=$(dirname "$BUILD_FILE")
            echo "Found build file:"
            echo "$BUILD_FILE"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "===== Using project directory ====="
          echo "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Show Gradle information
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "===== Java ====="
          java -version

          echo "===== Gradle ====="
          gradle --version

          echo "===== Project files ====="
          ls -la

      - name: Make Gradle wrapper executable
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "No Gradle wrapper found."
            echo "System Gradle will be used."
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          echo "===== Searching for APK ====="

          find "${{ env.PROJECT_DIR }}" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "${{ env.PROJECT_DIR }}" \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHREE-RADHE-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
