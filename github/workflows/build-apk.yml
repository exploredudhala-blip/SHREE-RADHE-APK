name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q SHREE_RADHE_Android_Project_v5.zip -d android-project

      - name: Show project files
        run: |
          echo "Project contents:"
          find android-project -maxdepth 5 -type f | head -200

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Gradle project
        run: |
          echo "Project contents:"
          find android-project -maxdepth 4 -type f | head -200

          BUILD_FILE=$(find android-project -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "No Gradle build file found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ "$USE_WRAPPER" = "true" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHREE-RADHE-APK
          path: |
            android-project/**/build/outputs/apk/**/*.apk
